<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Who's this? — Household Chores Manager</title>
</head>
<body>
    <h1>Who's doing chores?</h1>

    <ul>
        {% for person in people %}
            <li>
                <form method="post" action="{% url 'select_person' %}">
                    {% csrf_token %}
                    <input type="hidden" name="person_id" value="{{ person.id }}">
                    <button type="submit">{{ person.name }}</button>
                </form>
            </li>
        {% empty %}
            <li>No active profiles yet.</li>
        {% endfor %}
    </ul>

    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Log out</button>
    </form>
</body>
</html>
