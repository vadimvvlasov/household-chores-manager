<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Swap — {{ instance.chore.name }} — Household Chores Manager</title>
</head>
<body>
    <h1>Swap — {{ instance.chore.name }}</h1>
    <p>Currently: {{ instance.assigned_person.name }} — {{ instance.date }} {{ instance.scheduled_start|time:"H:i" }}</p>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="post" action="{% url 'swap' instance.id %}">
        {% csrf_token %}
        <label for="new_person">Swap to</label>
        <select id="new_person" name="new_person" required>
            {% for person in people %}
                <option value="{{ person.id }}">{{ person.name }}</option>
            {% endfor %}
        </select>

        <button type="submit">Swap</button>
    </form>

    <a href="{% url 'home' %}">Back to today's chores</a>
</body>
</html>
